name: Build and release tester

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: proxy-tester-windows.exe
          - os: ubuntu-latest
            asset: proxy-tester-linux
          - os: macos-latest
            asset: proxy-tester-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name proxy_tester --hidden-import socks --collect-all customtkinter proxy_tester.py

      - name: Rename asset
        shell: bash
        run: |
          if [ -f dist/proxy_tester.exe ]; then
            mv dist/proxy_tester.exe "dist/${{ matrix.asset }}"
          else
            mv dist/proxy_tester "dist/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
